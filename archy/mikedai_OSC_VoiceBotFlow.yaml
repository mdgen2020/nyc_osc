botFlow:
  name: mikedai_OSC_VoiceBotFlow
  description: "UNOFFICIAL DEMO - NY OSC Unclaimed Funds voice bot. Calls mikedai_OSC_ClaimAssistant; transfers to Support_MikeD only after the AVA escalates with a sanitized handoff case."
  division: Home
  startUpRef: "/botFlow/bots/bot[Default Bot_10]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
      speechToText:
        engine:
          name: Microsoft Azure
          defaultEngine: true
  variables:
    - stringVariable:
        name: Flow.FirstName
        initialValue:
          noValue: true
        isInput: true
        isOutput: false
    - stringVariable:
        name: Flow.CallerNumber
        initialValue:
          noValue: true
        isInput: true
        isOutput: false
    - stringVariable:
        name: Flow.HandoffCaseId
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.HandoffSummary
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.ContactFirst
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.ContactLast
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.ContactAddr1
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.ContactCity
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.ContactState
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.ContactZip
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.ContactPhone
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.ContactEmail
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.CLFirst
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.CLLast
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.CLAddr1
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.CLCity
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.CLState
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.CLZip
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.CLPhone
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.CLEmail
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - integerVariable:
        name: Flow.ContactIdx
        initialValue:
          lit: 0
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.AvaExitReason
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
  settingsActionDefaults:
    callGuide:
      voiceProcessingPrompt:
        exp: "MakeCommunication(\n  ToCommunication(NOT_SET))"
    agenticAskForIntent:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForIntent:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForSlot:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForBoolean:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    loopAnythingElse:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
  settingsErrorHandling:
    errorHandling:
      exit:
        none: true
    enableAgentEscalation:
      lit: true
    errorEventHandover:
      noValue: true
    agentEscalationConfirmation:
      noValue: true
    agentEscalationHandover:
      noValue: true
    recognitionFailureEventHandover:
      noValue: true
    recognitionFailureEventHandling:
      exit:
        none: true
    agentEscalationHandling:
      task:
        targetTaskRef: "/botFlow/tasks/task[Transfer to queue_20]"
  settingsPrompts:
    ensureAudioInPrompts: false
    promptMediaToValidate:
      - mediaType: audio
      - mediaType: tts
  settingsBotFlow:
    voiceProcessingPrompt:
      noValue: true
    initialPlaybackDelay:
      lit:
        ms: 250
    minimumPlaybackTime:
      lit:
        seconds: 1
    virtualAgentEnabled: true
  settingsUserInput:
    enableBargeIn:
      lit: true
    enableAutomaticQuickReplies:
      lit: false
    noMatchesMax:
      lit: 3
    noInputsMax:
      lit: 3
    noInputsTimeout:
      lit:
        seconds: 7
    speechToTextSpeechDetectionSensitivity:
      noValue: true
    speechToTextMaxSpeechTimeout:
      noValue: true
    speechToTextAdvancedConfiguration:
      noValue: true
    enableIntentClassificationHinting:
      lit: false
    interDigitTimeout:
      lit:
        seconds: 3
    dtmfTerminatingCharacter:
      noValue: true
    confirmationRejectionsMax:
      lit: 3
    collectionLowConfidenceThreshold:
      lit: 20
    collectionHighConfidenceThreshold:
      lit: 70
    confirmationLowConfidenceThreshold:
      lit: 40
    noMatchApology:
      exp: "MakeCommunication(\n  \"Sorry.\")"
    noInputApology:
      exp: "MakeCommunication(\n  \"Sorry, I didn't hear you.\")"
    noToConfirmationApology:
      exp: "MakeCommunication(\n  \"My mistake.\")"
    confirmationNoMatchApology:
      exp: "MakeCommunication(\n  \"Sorry, please say yes or no.\")"
    confirmationNoInputApology:
      exp: "MakeCommunication(\n  \"Sorry, I didn't hear you.  Please say yes or no.\")"
  settingsKnowledge:
    none: true
  settingsVirtualAgent:
    summarization:
      lit: true
    assignWrapupCodes:
      lit: true
    conversationSummarySetting:
      name: MikeD_Summary_Config
  bots:
    - bot:
        name: Default Bot
        refId: Default Bot_10
        trackingId: 10
        actions:
          - callAgenticVirtualAgent:
              name: Call Agentic Virtual Agent
              trackingId: 12
              agenticVirtualAgent:
                mikedai_OSC_ClaimAssistant:
                  ver_latestPublished:
                    inputs:
                      first_name:
                        exp: Flow.FirstName
                      caller_number:
                        exp: Flow.CallerNumber
                      interaction_channel:
                        lit: voice
                      conversation_id:
                        noValue: true
                      contact_reason:
                        noValue: true
                      has_claim_id:
                        noValue: true
                    outputs:
                      handoff.case_id:
                        var: Flow.HandoffCaseId
                      handoff.summary:
                        var: Flow.HandoffSummary
                      handoff.queue_id:
                        noValue: true
                    exitReason:
                      var: Flow.AvaExitReason
              outputs:
                failure:
                  actions:
                    - callTask:
                        name: Transfer after tool or AVA failure
                        trackingId: 17
                        targetTaskRef: "/botFlow/tasks/task[Transfer to queue_20]"
                timeout:
                  actions:
                    - callTask:
                        name: Transfer after timeout
                        trackingId: 18
                        targetTaskRef: "/botFlow/tasks/task[Transfer to queue_20]"
          - setParticipantData:
              name: Record AVA exit reason
              trackingId: 40
              attributes:
                - attribute:
                    name:
                      lit: mikedai_OSC_AvaExitReason
                    value:
                      exp: Flow.AvaExitReason
          - decision:
              name: Did the AVA hand off
              trackingId: 19
              condition:
                exp: IsNotSetOrEmpty(Flow.HandoffCaseId) and If(IsNotSetOrEmpty(Flow.AvaExitReason), true, Contains(Lower(Flow.AvaExitReason), "escal") == false)
              outputs:
                yes:
                  actions:
                    - exitBotFlow:
                        name: Exit Bot Flow
                        trackingId: 11
                no:
                  actions:
                    - callTask:
                        name: Transfer to queue
                        trackingId: 21
                        targetTaskRef: "/botFlow/tasks/task[Transfer to queue_20]"
          # A transfer can fall through if it fails, so the main sequence must still end in a terminating action.
          - exitBotFlow:
              name: Exit Bot Flow (end of sequence)
              trackingId: 30
  tasks:
    - task:
        name: Transfer to queue
        refId: Transfer to queue_20
        trackingId: 20
        actions:
          - callData:
              name: Get External Contact by Phone Number
              trackingId: 50
              timeout:
                lit:
                  seconds: 10
              category:
                PureCloud Data Actions:
                  dataAction:
                    Get External Contact by Phone Number:
                      inputs:
                        phoneNumber:
                          exp: Flow.CallerNumber
                      successOutputs:
                        contacts.firstName:
                          var: Flow.CLFirst
                        contacts.lastName:
                          var: Flow.CLLast
                        contacts.address.address1:
                          var: Flow.CLAddr1
                        contacts.address.address2:
                          noValue: true
                        contacts.address.state:
                          var: Flow.CLState
                        contacts.address.postalCode:
                          var: Flow.CLZip
                        contacts.address.city:
                          var: Flow.CLCity
                        contacts.address.countryCode:
                          noValue: true
                        contacts.workPhone.display:
                          noValue: true
                        contacts.cellPhone.display:
                          var: Flow.CLPhone
                        contacts.workEmail:
                          var: Flow.CLEmail
                      failureOutputs:
                        errorCode:
                          noValue: true
                        status:
                          noValue: true
                        correlationId:
                          noValue: true
                        entityId:
                          noValue: true
                        entityName:
                          noValue: true
                        userMessage:
                          noValue: true
                        userParamsMessage:
                          noValue: true
                        userParams.key:
                          noValue: true
                        userParams.value:
                          noValue: true
                        details.errorCode:
                          noValue: true
                        details.fieldName:
                          noValue: true
                        details.entityId:
                          noValue: true
                        details.entityName:
                          noValue: true
          - updateData:
              name: Pick the contact that matches the caller
              trackingId: 52
              statements:
                - integer:
                    variable: Flow.ContactIdx
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLFirst), 0, If(IsNotSetOrEmpty(Flow.FirstName), 0, If(FindFirst(Flow.CLFirst, Flow.FirstName) >= 0, FindFirst(Flow.CLFirst, Flow.FirstName), 0)))'
                - string:
                    variable: Flow.ContactFirst
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLFirst), "", If(Flow.ContactIdx < Count(Flow.CLFirst), GetAt(Flow.CLFirst, Flow.ContactIdx), ""))'
                - string:
                    variable: Flow.ContactLast
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLLast), "", If(Flow.ContactIdx < Count(Flow.CLLast), GetAt(Flow.CLLast, Flow.ContactIdx), ""))'
                - string:
                    variable: Flow.ContactAddr1
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLAddr1), "", If(Flow.ContactIdx < Count(Flow.CLAddr1), GetAt(Flow.CLAddr1, Flow.ContactIdx), ""))'
                - string:
                    variable: Flow.ContactCity
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLCity), "", If(Flow.ContactIdx < Count(Flow.CLCity), GetAt(Flow.CLCity, Flow.ContactIdx), ""))'
                - string:
                    variable: Flow.ContactState
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLState), "", If(Flow.ContactIdx < Count(Flow.CLState), GetAt(Flow.CLState, Flow.ContactIdx), ""))'
                - string:
                    variable: Flow.ContactZip
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLZip), "", If(Flow.ContactIdx < Count(Flow.CLZip), GetAt(Flow.CLZip, Flow.ContactIdx), ""))'
                - string:
                    variable: Flow.ContactPhone
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLPhone), "", If(Flow.ContactIdx < Count(Flow.CLPhone), GetAt(Flow.CLPhone, Flow.ContactIdx), ""))'
                - string:
                    variable: Flow.ContactEmail
                    value:
                      exp: 'If(IsNotSetOrEmpty(Flow.CLEmail), "", If(Flow.ContactIdx < Count(Flow.CLEmail), GetAt(Flow.CLEmail, Flow.ContactIdx), ""))'
          - setScreenPop:
              name: Set Screen Pop (agent script)
              trackingId: 51
              screenPopScript:
                miked_script_2026:
                  inputs:
                      CustomerFirstName:
                        exp: Flow.ContactFirst
                      CustomerLastName:
                        exp: Flow.ContactLast
                      CustomerAddressLine1:
                        exp: Flow.ContactAddr1
                      CustomerCity:
                        exp: Flow.ContactCity
                      CustomerState:
                        exp: Flow.ContactState
                      CustomerPostalCode:
                        exp: Flow.ContactZip
                      CustomerEmail:
                        exp: Flow.ContactEmail
                      SecurePauseOn:
                        lit: false
                      CustomerBalance:
                        lit: 0
                      Office Number:
                        lit: ""
                      Hardware:
                        lit: ""
                      IncState:
                        lit: ""
                      TicketNumber:
                        exp: Flow.HandoffCaseId
                      IncPriority:
                        lit: ""
                      IncNum:
                        lit: ""
                      customer_selection:
                        lit: "135"
                      ViolFirst:
                        lit: ""
                      Violation1:
                        lit: ""
                      ViolLast:
                        lit: ""
                      ViolPhone:
                        lit: ""
                      ViolDate:
                        lit: ""
                      ViolAmt:
                        lit: ""
                      PickupDate:
                        lit: ""
                      PickUpTime:
                        lit: ""
                      PickupLoc:
                        lit: ""
                      DropLoc:
                        lit: ""
                      RoundTrip:
                        lit: ""
                      ContactPh:
                        lit: ""
                      ConfNumb:
                        lit: ""
                      RiderName:
                        lit: ""
                      appt_date:
                        lit: ""
                      appt_loc:
                        lit: ""
                      appt_time:
                        lit: ""
                      booking_notes:
                        lit: ""
                      booking_status:
                        lit: ""
                      conf_numb:
                        lit: ""
                      contact_info:
                        exp: Flow.ContactPhone
                      contact_name:
                        lit: ""
                      service_type:
                        lit: ""
                      Authenticated:
                        lit: 00AA00
                      acct_number:
                        lit: ""
                      customer_name:
                        exp: Flow.ContactFirst + " " + Flow.ContactLast
                      acct_status:
                        lit: ""
                      balance_due:
                        lit: ""
                      due_date:
                        lit: ""
                      agent_summary:
                        exp: Flow.HandoffSummary
                      priority_level:
                        lit: ""
                      banner_color:
                        lit: ""
                      banner_text:
                        lit: ""
                      claim_number:
                        exp: Flow.HandoffCaseId
                      claim_descript:
                        lit: ""
                      Claim_level:
                        lit: ""
          - setParticipantData:
              name: Set handoff participant data
              trackingId: 22
              attributes:
                - attribute:
                    name:
                      lit: mikedai_OSC_HandoffCaseId
                    value:
                      exp: Flow.HandoffCaseId
                - attribute:
                    name:
                      lit: mikedai_OSC_HandoffSummary
                    value:
                      exp: Flow.HandoffSummary
          - transferToAcd:
              name: Transfer to ACD
              trackingId: 13
              targetQueue:
                lit:
                  name: Support_MikeD
              preTransferCommunication:
                noValue: true
              failureTransferCommunication:
                noValue: true
              priority:
                lit: 0
              preferredAgents:
                noValue: true
              languageSkill:
                noValue: true
              failureOutputs:
                errorType:
                  noValue: true
                errorMessage:
                  noValue: true
          - exitBotFlow:
              name: Exit Bot Flow (after transfer)
              trackingId: 31
